/* ===== Tokens: cada centro redefine estas variables ===== */
:root{
  color-scheme: light;
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#111761; --muted:#5D6290; --line:rgba(17,23,97,.12);
  --accent:#111761; --accent-soft:rgba(17,23,97,.08); --on-accent:#FFFFFF;
  --c1:#111761; --c2:#6C709D; --c3:#B9BCD6; --c4:#2F3A9E;
  --good:#1F8A4C; --bad:#C0392B;
  --display:'DM Serif Display', Georgia, serif; --body:'Manrope', system-ui, sans-serif;
  --radius:4px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; margin:0; padding:0; }
body[data-centro="artz"]{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#111761; --muted:#5D6290; --line:rgba(17,23,97,.13);
  --accent:#111761; --accent-soft:rgba(17,23,97,.07); --on-accent:#FFFFFF;
  --c1:#111761; --c2:#7E83B8; --c3:#C3C6E0; --c4:#3B47C4;
  --display:'DM Serif Display', Georgia, serif; --body:'Manrope', system-ui, sans-serif; --radius:2px;
}
body[data-centro="anima"]{
  --bg:#EFE8DC; --surface:#F8F3EA; --ink:#4A3D34; --muted:#857466; --line:rgba(74,61,52,.16);
  --accent:#4A3D34; --accent-soft:rgba(74,61,52,.08); --on-accent:#E1D6C2;
  --c1:#4A3D34; --c2:#A68B6D; --c3:#D5C6AE; --c4:#7A5C45;
  --display:'Cormorant Garamond', Georgia, serif; --body:'Montserrat', system-ui, sans-serif; --radius:0px;
}
body[data-centro="antara"]{
  --bg:#F0EAE7; --surface:#FAF7F5; --ink:#040404; --muted:#6E6764; --line:rgba(4,4,4,.12);
  --accent:#040404; --accent-soft:rgba(4,4,4,.06); --on-accent:#F0EAE7;
  --c1:#040404; --c2:#8C8380; --c3:#CFC6C2; --c4:#4A4542;
  --display:'Bodoni Moda', Didot, Georgia, serif; --body:'Jost', system-ui, sans-serif; --radius:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; }
  :root:not([data-theme="light"]) body[data-centro="artz"]{
    --bg:#0B0F3A; --surface:#121852; --ink:#E9EAF6; --muted:#9EA2CC; --line:rgba(233,234,246,.12);
    --accent:#E9EAF6; --accent-soft:rgba(233,234,246,.08); --on-accent:#111761;
    --c1:#E9EAF6; --c2:#8F95D6; --c3:#4B5299; --c4:#6F7BFF; --good:#4CC584; --bad:#FF7A6B; }
  :root:not([data-theme="light"]) body[data-centro="anima"]{
    --bg:#3B302A; --surface:#4A3D34; --ink:#E1D6C2; --muted:#B6A690; --line:rgba(225,214,194,.14);
    --accent:#E1D6C2; --accent-soft:rgba(225,214,194,.08); --on-accent:#4A3D34;
    --c1:#E1D6C2; --c2:#B89A78; --c3:#7D6857; --c4:#D9B48A; --good:#7FCB98; --bad:#F08B7A; }
  :root:not([data-theme="light"]) body[data-centro="antara"]{
    --bg:#121010; --surface:#1C1918; --ink:#F0EAE7; --muted:#A39B97; --line:rgba(240,234,231,.12);
    --accent:#F0EAE7; --accent-soft:rgba(240,234,231,.07); --on-accent:#040404;
    --c1:#F0EAE7; --c2:#9C918C; --c3:#5A5350; --c4:#CDB9AE; --good:#7FCB98; --bad:#F08B7A; }
}
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-theme="dark"] body[data-centro="artz"]{ --bg:#0B0F3A; --surface:#121852; --ink:#E9EAF6; --muted:#9EA2CC; --line:rgba(233,234,246,.12); --accent:#E9EAF6; --accent-soft:rgba(233,234,246,.08); --on-accent:#111761; --c1:#E9EAF6; --c2:#8F95D6; --c3:#4B5299; --c4:#6F7BFF; }
:root[data-theme="dark"] body[data-centro="anima"]{ --bg:#3B302A; --surface:#4A3D34; --ink:#E1D6C2; --muted:#B6A690; --line:rgba(225,214,194,.14); --accent:#E1D6C2; --accent-soft:rgba(225,214,194,.08); --on-accent:#4A3D34; --c1:#E1D6C2; --c2:#B89A78; --c3:#7D6857; --c4:#D9B48A; }
:root[data-theme="dark"] body[data-centro="antara"]{ --bg:#121010; --surface:#1C1918; --ink:#F0EAE7; --muted:#A39B97; --line:rgba(240,234,231,.12); --accent:#F0EAE7; --accent-soft:rgba(240,234,231,.07); --on-accent:#040404; --c1:#F0EAE7; --c2:#9C918C; --c3:#5A5350; --c4:#CDB9AE; }

body{ font-family:var(--body); background:var(--bg); color:var(--ink); line-height:1.5; min-height:100vh; transition:background .35s, color .35s; -webkit-font-smoothing:antialiased; }
button,select,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ===== Selector de centro: los logos son la navegación ===== */
.switcher{ position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--surface); border-bottom:1px solid var(--line); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:41; background:var(--surface); }
.switcher-inner{ max-width:1440px; margin:0 auto; display:flex; align-items:stretch; gap:0; padding:0 1.25rem; overflow-x:auto; }
.centro-btn{ background:none; border:none; cursor:pointer; padding:1rem 1.6rem .85rem; display:flex; align-items:center; gap:.6rem; border-bottom:2px solid transparent; opacity:.42; transition:opacity .2s, border-color .2s; flex-shrink:0; }
.centro-btn:hover{ opacity:.75; }
.centro-btn[aria-selected="true"]{ opacity:1; border-bottom-color:var(--ink); }
.logo{ display:block; background:var(--ink); -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; }

.centro-btn .logo.artz{ height:18px; } .centro-btn .logo.anima{ height:26px; } .centro-btn .logo.antara{ height:20px; }
.antara-word{ font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.32em; font-size:.8rem; color:var(--ink); }
.switcher-meta{ margin-left:auto; display:flex; align-items:center; gap:.75rem; padding-left:1rem; flex-shrink:0; }
.badge-demo{ font-size:.75rem; font-weight:600; padding:.3rem .7rem; border:1px dashed var(--muted); color:var(--muted); border-radius:var(--radius); white-space:nowrap; }

/* ===== Cabecera del centro ===== */
.hero{ max-width:1440px; margin:0 auto; padding:2.5rem 1.5rem 1.5rem; display:grid; grid-template-columns:1fr auto; gap:1.5rem 2rem; align-items:end; }
.hero-brand{ display:flex; align-items:center; gap:1rem; }
.hero .logo.artz{ height:54px; } .hero .logo.anima{ height:82px; } .hero .logo.antara{ height:58px; }
.hero .antara-word{ font-size:1.05rem; }
.hero-sub{ color:var(--muted); font-size:.95rem; margin-top:.6rem; max-width:52ch; }
.months{ display:flex; gap:.35rem; flex-wrap:wrap; justify-content:flex-end; }
.chip{ background:transparent; border:1px solid var(--line); padding:.42rem .95rem; border-radius:var(--radius); cursor:pointer; font-size:.85rem; font-weight:600; color:var(--muted); transition:all .15s; }
.chip:hover{ border-color:var(--ink); color:var(--ink); }
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.chip:disabled{ opacity:.35; cursor:not-allowed; }
.field-label{ font-size:.8rem; color:var(--muted); margin-bottom:.4rem; text-align:right; }

/* ===== Plataformas ===== */
.platforms{ max-width:1440px; margin:0 auto; padding:0 1.5rem; display:flex; gap:2rem; border-bottom:1px solid var(--line); overflow-x:auto; }
.plat-btn{ background:none; border:none; cursor:pointer; padding:.9rem 0; font-size:1.05rem; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; font-family:var(--display); font-size:1.35rem; font-weight:500; }
.plat-btn[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--ink); }
.wrap{ max-width:1440px; margin:0 auto; padding:1.5rem 1.5rem 4rem; }
.toolbar{ display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:1.5rem; }
.toolbar .lbl{ font-size:.85rem; color:var(--muted); margin-right:.25rem; }

/* ===== KPI: una franja, no tarjetas ===== */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); border-top:1px solid var(--ink); border-bottom:1px solid var(--line); margin-bottom:2.25rem; }
.kpi{ padding:1.1rem 1rem 1.2rem; border-right:1px solid var(--line); min-width:0; overflow:hidden; }
.kpi:last-child{ border-right:none; }
.kpi-label{ font-size:.8rem; color:var(--muted); font-weight:500; }
.kpi-value{ white-space:nowrap; font-family:var(--display); font-size:clamp(1.6rem,2.2vw,2.1rem); line-height:1.1; margin-top:.35rem; font-weight:500; font-variant-numeric:lining-nums tabular-nums; }
body[data-centro="anima"] .kpi-value{ font-size:clamp(1.8rem,2.4vw,2.4rem); font-weight:600; }
.kpi-note{ font-size:.75rem; color:var(--muted); margin-top:.2rem; }

.section-title{ font-family:var(--display); font-size:1.6rem; font-weight:500; margin-bottom:.25rem; }
body[data-centro="anima"] .section-title{ font-size:1.9rem; font-weight:600; }
.section-desc{ color:var(--muted); font-size:.88rem; margin-bottom:1rem; }
.section{ margin-bottom:2.75rem; }
.grid-2{ display:grid; grid-template-columns:1.4fr 1fr; gap:2rem; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--radius) > 20px ? 18px : 6px); padding:1.25rem 1.25rem 1rem; }
body[data-centro="antara"] .panel{ border-radius:18px; }
body[data-centro="artz"] .panel{ border-radius:2px; }
.chart-box{ position:relative; height:290px; }

/* ===== Top anuncios ===== */
.top-head{ display:flex; justify-content:space-between; align-items:end; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
select{ background:var(--surface); border:1px solid var(--line); padding:.45rem .8rem; border-radius:6px; font-size:.85rem; cursor:pointer; }
.top-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1rem; }
.top-card{ background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
body[data-centro="antara"] .top-card{ border-radius:18px; }
.top-media{ position:relative; aspect-ratio:4/5; background:var(--accent-soft); overflow:hidden; }
.top-media a{ display:block; height:100%; }
.top-img{ display:block; width:100%; height:100%; object-fit:cover; transition:transform .35s ease; }
.top-media a:hover .top-img{ transform:scale(1.03); }
.top-img.ph, .thumb.ph{ display:grid; place-items:center; color:var(--muted); font-family:var(--display); font-size:2.4rem; letter-spacing:.05em; background:var(--accent-soft); }
.top-rank{ position:absolute; top:.65rem; left:.65rem; min-width:2.2rem; height:2.2rem; padding:0 .5rem; display:grid; place-items:center; background:var(--surface); color:var(--ink); font-family:var(--display); font-size:1.2rem; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.top-body{ padding:.9rem 1rem 1rem; display:flex; flex-direction:column; flex:1; }

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CENTROS = {
  artz:   { nombre:'Artz Pedregal',  sub:'Ciudad de México' },
  anima:  { nombre:'Ánima Village',  sub:'Los Cabos' },
  antara: { nombre:'Antara',         sub:'Ciudad de México' },
};
const MES_NOMBRES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const PRIMER_ANIO = 2026;               // primer año que aparece en el selector
const DEMO_DESDE = '2026-08-01';        // los datos de ejemplo empiezan aquí
let OBJETIVOS_META = ['Alcance','Interacción','Tráfico a página','Tráfico a web'];
// Endpoints de Vercel (carpeta /api). Reciben ?since=AAAA-MM-DD&until=AAAA-MM-DD.
// Si alguno no existe o falla, esa plataforma usa datos de ejemplo.
const ENDPOINTS = { meta:'/api/meta-data', google:'/api/google-ads-data' };
// Google Sheets "Dash | KPI's Ánima & Artz" (compartido como lector con enlace).
// TikTok sale de una pestaña por plaza; los seguimientos de IG de su propia pestaña.
const SHEET_ID = '1-DSHYTCH7ayjKJml1f4No_QqPDTQdjt0FTL8PXRQgxE';
const TIKTOK_TABS = { artz:'Query_Tik Tok ARTZ', anima:'Query_TikTok ANIMA', antara:'Query_TikTok Antara' };
const FOLLOW_TAB = 'Seguidores IG';
const PLAT_NOMBRE = { meta:'Meta Ads', tiktok:'TikTok Ads', google:'Google Ads' };

/* =========================================================================
   FECHAS (siempre en hora local; nunca new Date('AAAA-MM-DD'))
   ========================================================================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseLocal = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
function eachDay(since, until){ const out=[]; const d=parseLocal(since), e=parseLocal(until); while(d<=e){ out.push(ymd(d)); d.setDate(d.getDate()+1); } return out; }
function fmtFechaLarga(s){ const d=parseLocal(s); return `${d.getDate()} de ${MES_NOMBRES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; }
function fmtFechaCorta(s){ const d=parseLocal(s); return `${d.getDate()} ${MES_NOMBRES[d.getMonth()].slice(0,3).toLowerCase()}`; }

/* =========================================================================
   ESTADO
   ========================================================================= */
const hoy = new Date();
const state = {
  centro:'artz', plat:'general', objetivo:'all', topBy:'visitas_perfil', search:'', sort:{}, showAll:{}, lib:{},
  periodo:{ tipo:'mes', anio:hoy.getFullYear(), mes:hoy.getMonth() },
  custom:{ since: ymd(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), until: todayStr() },
};
const PAGE = 12;

function resolveRange(){
  const t = todayStr();
  if(state.periodo.tipo==='custom'){
    let { since, until } = state.custom;
    if(until > t) until = t;
    if(since > until) since = until;
    return { since, until };
  }
  const { anio, mes } = state.periodo;
  const since = ymd(new Date(anio, mes, 1));
  let until = ymd(new Date(anio, mes+1, 0));
  if(until > t) until = t;
  return { since, until };
}

/* =========================================================================
   DATOS DE EJEMPLO (diarios, con la misma forma que devuelve /api)
   ========================================================================= */
function rng(seedStr){ let h=1779033703^seedStr.length; for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19;} let a=h>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
const CONCEPTOS = {
  artz:   ['Temporada navideña','Restaurantes de la terraza','Moda otoño','Fin de semana en familia','Cine y entretenimiento'],
  anima:  ['Atardecer en Los Cabos','Gastronomía local','Arte y diseño','Noches en la plaza','Familia en vacaciones'],
  antara: ['Día de Muertos','Lujo y moda','Terraza Polanco','Lanzamientos de marcas','Regalos de temporada'],
};
let DEMO = null;
function buildDemo(){
  const meta=[], tiktok=[], google=[];
  const days = eachDay(DEMO_DESDE, todayStr());
  for(const c of Object.keys(CENTROS)){
    const objs = c==='anima' ? OBJETIVOS_META.slice(0,4) : OBJETIVOS_META.slice(0,3);
    for(const fecha of days){
      const d = parseLocal(fecha);
      // El conjunto se nombra con el mes en que se lanzó; los primeros días del mes
      // siguen corriendo los del mes anterior (como pasa en la cuenta real).
      const lanz = d.getDate() <= 2 && d.getMonth()>7 ? new Date(d.getFullYear(), d.getMonth()-1, 1) : d;
      const mesConjunto = MES_NOMBRES[lanz.getMonth()].toUpperCase();
      for(const o of objs){
        CONCEPTOS[c].forEach((con,i)=>{
          if(i===4 && o!=='Alcance') return;
          const r=rng(c+fecha+o+con);
          const gasto = Math.round((o==='Alcance'?300:o==='Tráfico a web'?230:200)*(.55+r()));
          const cpm = (o==='Alcance'?28:o==='Interacción'?55:o==='Tráfico a página'?70:80)*(.75+r()*.5);
          const imp = Math.round(gasto/cpm*1000);
          const alc = Math.round(imp/(1.1+r()*.3));
          const vp = Math.round(imp*(o==='Tráfico a página'?.014:o==='Interacción'?.004:.0015)*(.6+r()*.9));
          meta.push({ fecha, centro:c, campana:`${c==='anima'?'ANIMA':c.toUpperCase()} | ${o.toUpperCase()}`, objetivo:o,
            conjunto:`${o.toUpperCase()} | ${mesConjunto}`, anuncio:con,
            gasto, alcance:alc, impresiones:imp, visitas_perfil:vp, seguidores:Math.round(vp*(.08+r()*.14)),
            clics_enlace: o==='Tráfico a web' ? Math.round(imp*.009*(.7+r()*.6)) : 0 });
        });
      }
      ['Awareness','Video views'].forEach(grupo=>{
        CONCEPTOS[c].slice(0,4).forEach(con=>{
          const r=rng('tt'+c+fecha+grupo+con);
          const gasto=Math.round(170*(.5+r())), imp=Math.round(gasto/((grupo==='Awareness'?18:24)*(.75+r()*.5))*1000);
          const vv=Math.round(imp*(.35+r()*.25)), vv50=Math.round(vv*(.28+r()*.2));
          tiktok.push({ fecha, centro:c, cuenta:CENTROS[c].nombre, campana:`${CENTROS[c].nombre} | ${grupo}`, grupo:`${grupo} | ${MES_NOMBRES[lanz.getMonth()]}`, anuncio:con,
            gasto, alcance:Math.round(imp/(1.2+r()*.4)), impresiones:imp, clics:Math.round(imp*.006*(.6+r()*.9)), vv, vv50, vv100:Math.round(vv50*(.35+r()*.25)) });
        });
      });
      [['YouTube in-stream','video'],['Demand Gen','video'],['Display','display'],['Búsqueda de marca','search']].forEach(([grupo,tipo])=>{
        CONCEPTOS[c].slice(0,3).forEach(con=>{
          const r=rng('g'+c+fecha+grupo+con);
          const imp=Math.round((tipo==='search'?600:tipo==='display'?5300:4000)*(.5+r()));
          const clics=Math.round(imp*(tipo==='search'?.07:tipo==='display'?.004:.008)*(.7+r()*.6));
          const vv25 = tipo==='video' ? Math.round(imp*(.32+r()*.2)) : 0;
          google.push({ fecha, centro:c, campana:CENTROS[c].nombre, grupo, tipo, anuncio:`${con}${tipo==='search'?' (RSA)':''}`,
            gasto:Math.round(imp/1000*(tipo==='search'?400:60)), impresiones:imp, clics, interacciones: tipo==='video' ? Math.round(imp*(.28+r()*.2)) : clics,
            vv25, vv100: tipo==='video' ? Math.round(vv25*(.22+r()*.2)) : 0 });
        });
      });
    }
  }
  return { meta, tiktok, google };
}

/* =========================================================================
   AGREGACIÓN
   ========================================================================= */
const META_SUM = ['gasto','alcance','impresiones','visitas_perfil','seguidores','clics_enlace'];
const TT_SUM = ['gasto','alcance','impresiones','clics','vv','vv50','vv100'];
const G_SUM = ['gasto','impresiones','clics','interacciones','vv25','vv100'];
const ID_FIELDS = { meta:['centro','campana','objetivo','conjunto','anuncio'], tiktok:['centro','cuenta','campana','grupo','anuncio'], google:['centro','campana','grupo','tipo','anuncio'] };
const SUM_FIELDS = { meta:META_SUM, tiktok:TT_SUM, google:G_SUM };
function aggregate(rows, idFields, sumFields){
  const m = new Map();
  for(const r of rows){
    const k = idFields.map(f=>r[f]).join('\u0001');
    let o = m.get(k);
    if(!o){ o={}; idFields.forEach(f=>o[f]=r[f]); sumFields.forEach(f=>o[f]=0); m.set(k,o); }
    sumFields.forEach(f=>o[f]+=r[f]||0);
  }
  return [...m.values()];
}
function sum(rows, keys){ const o={}; keys.forEach(k=>o[k]=0); const seen={}; rows.forEach(r=>keys.forEach(k=>{ if(r[k]!=null) seen[k]=1; o[k]+=r[k]||0; })); if(rows.length && keys.includes('seguidores') && !seen.seguidores) o.seguidores=null; return o; }
function groupBy(rows, keyFn){ const m=new Map(); rows.forEach(r=>{ const k=keyFn(r); if(!m.has(k)) m.set(k,[]); m.get(k).push(r); }); return m; }

/* =========================================================================
   CARGA POR RANGO (con caché)
   ========================================================================= */
/* ===== Google Sheets (gviz) ===== */
async function fetchSheetTab(sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if(!match) throw new Error(`No se pudo leer la pestaña "${sheetName}" (¿está compartido el Sheet?)`);
  const json = JSON.parse(match[1]);
  if(json.status === 'error') throw new Error(`Pestaña "${sheetName}": ${(json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'error de gviz'}`);
  const cols = json.table.cols.map(c => (c.label||'').trim());
  return (json.table.rows||[]).map(r => { const o={}; cols.forEach((l,i)=>{ const c=r.c[i]; o[l] = c ? (c.v ?? c.f) : null; }); return o; });
}
// Fechas de gviz: "Date(2026,9,11)" (mes base 0), "AAAA-MM-DD" o "DD/MM/AAAA".
function sheetDate(v){
  if(v==null || v==='') return null;
  const s=String(v).trim(); let m;
  if((m=s.match(/^Date\((\d+),(\d+),(\d+)/))) return `${m[1]}-${pad(+m[2]+1)}-${pad(+m[3])}`;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
const nnum = v => { const n = typeof v==='number' ? v : parseFloat(String(v??'').replace(/[$,\s]/g,'')); return isFinite(n) ? n : 0; };
const adKey = v => String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function centroDeTexto(v){ const k=adKey(v); return k.includes('ARTZ')?'artz':k.includes('ANIMA')?'anima':k.includes('ANTARA')?'antara':null; }

let SHEET = { tiktok:null, seguidores:null, errTikTok:null, errSeg:null };
async function loadSheet(){
  const [tt, seg] = await Promise.all([
    Promise.all(Object.entries(TIKTOK_TABS).map(async ([centro, tab]) => (await fetchSheetTab(tab)).map(r => {
      const fecha = sheetDate(r['Date']); const mes = Math.round(nnum(r['Month']));
      return { centro, cuenta:CENTROS[centro].nombre, fecha, anio: fecha ? +fecha.slice(0,4) : null, mesNum: mes,
        campana:r['Campaign name']||'—', grupo:r['Ad group name']||'—', anuncio:r['Ad name']||'—',
        gasto:nnum(r['Cost']), alcance:nnum(r['Reach']), impresiones:nnum(r['Impressions']), clics:nnum(r['Clicks']),
        vv:nnum(r['Video views']), vv50:nnum(r['Video views at 50%']), vv100:nnum(r['Video views at 100%']) };
    }).filter(r => r.mesNum>=1 && r.mesNum<=12 && (r.gasto||r.impresiones)))).then(a=>a.flat()).catch(e=>{ SHEET.errTikTok=e.message; return null; }),
    fetchSheetTab(FOLLOW_TAB).then(rows => rows.map(r => ({
      mesNum: Math.round(nnum(r['Mes'])), centro: centroDeTexto(r['Plaza']), key: adKey(r['Anuncio']), anuncio: r['Anuncio'],
      valor: (r['Seguimientos IG']==null || r['Seguimientos IG']==='') ? null : nnum(r['Seguimientos IG']),
    })).filter(r => r.centro && r.mesNum>=1 && r.mesNum<=12)).catch(e=>{ SHEET.errSeg=e.message; return null; }),
  ]);
  SHEET.tiktok = tt; SHEET.seguidores = seg;
}
// Meses (AAAA-MM) que toca el periodo elegido.
function mesesDelPeriodo(){
  if(state.periodo.tipo==='mes') return [{ anio:state.periodo.anio, mes:state.periodo.mes+1 }];
  const r = resolveRange(); const out=[]; const d=parseLocal(r.since); d.setDate(1); const e=parseLocal(r.until);
  while(d<=e){ out.push({ anio:d.getFullYear(), mes:d.getMonth()+1 }); d.setMonth(d.getMonth()+1); }
  return out;
}
function tiktokFromSheet(range){
  let rows;
  if(state.periodo.tipo==='mes'){
    // Mes elegido = columna "Month" de la pestaña (10 = octubre…), del año elegido.
    rows = SHEET.tiktok.filter(r => r.mesNum===state.periodo.mes+1 && (r.anio==null || r.anio===state.periodo.anio));
  } else {
    rows = SHEET.tiktok.filter(r => r.fecha && r.fecha>=range.since && r.fecha<=range.until);
  }
  return { rows: aggregate(rows, ID_FIELDS.tiktok, SUM_FIELDS.tiktok), daily: aggregate(rows.filter(r=>r.fecha), ['fecha','centro'], ['gasto','impresiones']) };
}
// Reparte los seguimientos del Sheet entre las filas de Meta con el mismo nombre de anuncio.
function applySeguidores(meta){
  const meses = new Set(mesesDelPeriodo().map(m=>m.mes));
  const segRows = SHEET.seguidores.filter(r => meses.has(r.mesNum));
  const totals = {}; const byAd = new Map();
  segRows.forEach(r => {
    if(r.valor==null) return;
    totals[r.centro] = (totals[r.centro]||0) + r.valor;
    const k = r.centro+'|'+r.key; byAd.set(k, (byAd.get(k)||0) + r.valor);
  });
  const rows = meta.rows.map(r => ({ ...r, seguidores:null }));
  const groups = groupBy(rows, r => r.centro+'|'+adKey(r.anuncio));
  let matched = 0;
  groups.forEach((rs, k) => {
    if(!byAd.has(k)) return;
    const val = byAd.get(k); matched++;
    const base = rs.reduce((a,r)=>a+(r.visitas_perfil||r.gasto||0),0) || rs.length;
    rs.forEach(r => { r.seguidores = val * ((r.visitas_perfil||r.gasto||0) || (base===rs.length?1:0)) / base; });
  });
  return { ...meta, rows, segTotals: totals, segMatched: matched, segSheetAds: byAd.size };
}

let DATA = { meta:{rows:[],daily:[]}, tiktok:{rows:[],daily:[]}, google:{rows:[],daily:[]} };
let SOURCE_STATUS = { meta:'demo', tiktok:'demo', google:'demo' };
let SOURCE_ERR = {};
const NO_ENDPOINT = new Set();
const CACHE = new Map();

function demoFor(plat, range){
  if(!DEMO) DEMO = buildDemo();
  const inRange = DEMO[plat].filter(r => r.fecha >= range.since && r.fecha <= range.until);
  return {
    rows: aggregate(inRange, ID_FIELDS[plat], SUM_FIELDS[plat]),
    daily: aggregate(inRange, plat==='meta' ? ['fecha','centro','objetivo'] : ['fecha','centro'], ['gasto','impresiones']),
  };
}
async function loadRange(range){
  const key = range.since+'|'+range.until+'|'+state.periodo.tipo;
  if(CACHE.has(key)){ const c=CACHE.get(key); DATA=c.data; SOURCE_STATUS=c.status; SOURCE_ERR=c.err; return; }
  const data={}, status={}, errs={};
  await Promise.all(Object.entries(ENDPOINTS).map(async ([plat,url])=>{
    try{
      if(location.protocol==='file:' || NO_ENDPOINT.has(plat)){ const e=new Error('sin conexión'); e.status=404; throw e; }
      const res = await fetch(`${url}?since=${range.since}&until=${range.until}`, { headers:{ 'Accept':'application/json' } });
      if(!res.ok){ const b=await res.json().catch(()=>({})); const e=new Error(b.detail||b.error||('HTTP '+res.status)); e.status=res.status; throw e; }
      const json = await res.json();
      if(!Array.isArray(json.rows)) throw new Error('respuesta sin "rows"');
      data[plat] = { rows: json.rows, daily: Array.isArray(json.daily) ? json.daily : [] };
      status[plat] = 'live';
    }catch(err){
      if(err.status===404) NO_ENDPOINT.add(plat);
      if(err.status!==404) console.warn(`[${plat}] usando datos de ejemplo:`, err.message);
      data[plat] = demoFor(plat, range);
      status[plat] = (err.status && err.status!==404) ? 'error' : 'demo';
      errs[plat] = err.message;
    }
  }));
  // TikTok: Google Sheets (una pestaña por plaza).
  if(SHEET.tiktok){ data.tiktok = tiktokFromSheet(range); status.tiktok = 'sheet'; }
  else { data.tiktok = demoFor('tiktok', range); status.tiktok = SHEET.errTikTok ? 'error' : 'demo'; errs.tiktok = SHEET.errTikTok; }
  // Seguimientos de Instagram: pestaña "Seguidores IG".
  if(SHEET.seguidores) data.meta = applySeguidores(data.meta);
  DATA=data; SOURCE_STATUS=status; SOURCE_ERR=errs;
  // Objetivos: los cuatro base y cualquier otro que venga en los datos reales.
  [...new Set(DATA.meta.rows.map(r=>r.objetivo))].forEach(o=>{ if(o && !OBJETIVOS_META.includes(o)) OBJETIVOS_META.push(o); });
  CACHE.set(key, { data, status, err:errs });
}

const nf = new Intl.NumberFormat('es-MX');
const fInt = v => nf.format(Math.round(v||0));
const fMXN = v => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(v||0);
const fMXN2 = v => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2}).format(isFinite(v)?v:0);
const fPct = v => (isFinite(v)?(v*100):0).toFixed(2)+'\u00a0%';
const fDec = v => (isFinite(v)?v:0).toFixed(2);
function fCompact(v){ v=v||0; if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'\u00a0M'; if(Math.abs(v)>=1e4) return (v/1e3).toFixed(1)+'\u00a0k'; return fInt(v); }
const fCompactMXN = v => '$'+fCompact(v);
const div = (a,b) => b ? a/b : 0;
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Miniatura del anuncio (o un recuadro con iniciales si no hay imagen).
function mediaHTML(src, name, cls){
  const ini = esc(String(name||'').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,' ').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '·');
  return src
    ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;${cls} ph&quot;>${ini}</span>'">`
    : `<span class="${cls} ph">${ini}</span>`;
}

/* =========================================================================
   BIBLIOTECA DE ANUNCIOS (tarjetas)
   Imagen original o la miniatura más grande que entrega la plataforma, sin recorte.
   Métrica no disponible = «—» (nunca se sustituye por otra).
   ========================================================================= */
const dash = (v, f) => (v==null || !isFinite(v)) ? '—' : f(v);
// Si la imagen principal falla (o YouTube devuelve su miniatura gris de 120 px), usa la alterna;
// si tampoco hay, muestra el aviso «Imagen no disponible».
function adImgLoad(img){ if(img.naturalWidth && img.naturalWidth <= 120 && img.dataset.alt){ adImgError(img); } }
function adImgError(img){
  const alt = img.dataset.alt;
  if(alt){ img.dataset.alt=''; img.src = alt; return; }
  const box = img.closest('.ad-media'); if(box){ img.remove(); box.insertAdjacentHTML('afterbegin','<span class="ad-noimg">Imagen no disponible</span>'); }
}
function adMedia(a){
  if(!a.imagen) return '<span class="ad-noimg">Imagen no disponible</span>';
  return `<a href="${esc(a.imagen)}" target="_blank" rel="noopener" title="Ver imagen completa"><img src="${esc(a.imagen)}" data-alt="${esc(a.imagen_alt||'')}" alt="${esc(a.name)}" loading="lazy" referrerpolicy="no-referrer" onload="adImgLoad(this)" onerror="adImgError(this)"></a>`;
}
// a = { name, campana, imagen, imagen_alt, alcance, impresiones, ctr_unico, frecuencia }
function adCard(a, opts={}){
  return `<article class="ad-card fade-in">
    <div class="ad-media">${adMedia(a)}${opts.rank?`<span class="ad-rank">${opts.rank}</span>`:''}</div>
    <div class="ad-body">
      <h3 class="ad-name">${esc(a.name)}</h3>
      <p class="ad-camp"><span>Campaña</span> ${esc(a.campana||'—')}</p>
      ${opts.highlight ? `<p class="ad-highlight">${opts.highlight}</p>` : ''}
      <dl class="ad-metrics">
        <div><dt>Alcance</dt><dd>${dash(a.alcance, fInt)}</dd></div>
        <div><dt>Impresiones</dt><dd>${dash(a.impresiones, fInt)}</dd></div>
        <div><dt>CTR único</dt><dd>${dash(a.ctr_unico, fPct)}</dd></div>
        <div><dt>Frecuencia</dt><dd>${dash(a.frecuencia, fDec)}</dd></div>
      </dl>
    </div>
  </article>`;
}

// Serie de tiempo: por día hasta 62 días; por mes en rangos más largos.
function timeSeries(daily){
  const r = resolveRange(); const days = eachDay(r.since, r.until);
  const byMonth = days.length > 62;
  const keyOf = f => byMonth ? f.slice(0,7) : f;
  const keys = [...new Set(days.map(keyOf))];
  const acc = new Map(keys.map(k=>[k,{gasto:0,impresiones:0}]));
  daily.forEach(d=>{ const a=acc.get(keyOf(d.fecha)); if(a){ a.gasto+=d.gasto||0; a.impresiones+=d.impresiones||0; } });
  return { byMonth, labels: keys.map(k=> byMonth ? MES_NOMBRES[+k.slice(5,7)-1].slice(0,3)+' '+k.slice(0,4) : fmtFechaCorta(k)), data: keys.map(k=>acc.get(k)) };
}

      { type:'bar', order:1, label:'Gasto', data:ts.data.map(d=>d.gasto), backgroundColor:css('--c3'), yAxisID:'y', borderRadius:2 },
      { type:'line', order:0, label:'Impresiones', data:ts.data.map(d=>d.impresiones), borderColor:css('--c1'), backgroundColor:css('--c1'), yAxisID:'y1', tension:.3, pointRadius:ts.labels.length>20?0:3 } ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10}}, tooltip:{ callbacks:{ label:c=> c.dataset.label+': '+(c.dataset.label==='Gasto'?fMXN(c.raw):fInt(c.raw)) } } },
      scales:{ x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:12}}, y:{ beginAtZero:true, ticks:{callback:v=>fCompactMXN(v)} }, y1:{ position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>fCompact(v)} } } } }));
  return ts.byMonth;
}

/* ----- META ----- */
function renderMeta(){
  const base = rowsFor('meta');
  const presentes = new Set(base.map(r=>r.objetivo));
  if(state.objetivo!=='all' && !presentes.has(state.objetivo)) state.objetivo='all';
  const rows = base.filter(r=>state.objetivo==='all'||r.objetivo===state.objetivo);
  const t = metaDerive(sum(rows, META_SUM));
  const segSheet = !!DATA.meta.segTotals;
  if(segSheet && state.objetivo==='all'){ t.seguidores = DATA.meta.segTotals[state.centro] ?? null; t.conv = t.seguidores==null ? null : div(t.seguidores, t.visitas_perfil); }
  const showWeb = rows.some(r=>r.clics_enlace>0) || state.objetivo==='Tráfico a web';

  let h = `<div class="toolbar"><span class="lbl">Objetivo</span>
    ${['all',...OBJETIVOS_META].map(o=>{ const ok = o==='all'||presentes.has(o);
      return `<button class="chip" data-obj="${o}" aria-pressed="${state.objetivo===o}" ${ok?'':'disabled title="Sin campañas con este objetivo en el periodo"'}>${o==='all'?'Todos':o}</button>`; }).join('')}
  </div>`;
  h += kpiStrip([
    {l:'Gasto', v:fMXN(t.gasto)},
    {l:'Alcance', v:fCompact(t.alcance)},
    {l:'Impresiones', v:fCompact(t.impresiones)},
    {l:'Frecuencia', v:fDec(t.frecuencia)},
    {l:'CPM', v:fMXN2(t.cpm)},
    {l:'Visitas al perfil', v:fCompact(t.visitas_perfil)},
    {l:'Seguidores IG', v:t.seguidores==null?'—':fInt(t.seguidores), n: segSheet ? (state.periodo.tipo==='mes' ? 'Google Sheets' : 'Google Sheets · por mes completo') : 'Atribuidos a anuncios'},
    {l:'Conv. visita → seguidor', v:fPctDash(t.conv)},
    ...(showWeb?[{l:'Clics al sitio web', v:fCompact(t.clics_enlace)}]:[])
  ]);
  h += `<div class="section grid-2">
    <div><h2 class="section-title" id="c1t">Gasto e impresiones por día</h2><p class="section-desc">El gasto se cuenta en la fecha en que ocurrió.</p><div class="panel"><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div><h2 class="section-title">CPM por objetivo</h2><p class="section-desc">Cuánto cuesta cada mil impresiones según el objetivo.</p><div class="panel"><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>`;

  // Cada anuncio con sus métricas del periodo (una fila de Meta = un anuncio).
  const adList = rows.map(r=>{ const d = metaDerive(r); return { ...d, name:r.anuncio, campana:r.campana, conjunto:r.conjunto,
    frecuencia: r.alcance ? r.impresiones/r.alcance : null, ctr_unico: r.ctr_unico ?? null }; });
  const topOpts = [['visitas_perfil','Visitas al perfil'],['seguidores','Seguidores IG'],['alcance','Alcance'],['impresiones','Impresiones'],['ctr_unico','CTR único'],['cpm','CPM más bajo'],['conv','Conversión visita → seguidor']];
  const by = state.topBy; const asc = by==='cpm';
  const top = adList.filter(a=> a[by]!=null && isFinite(a[by]) && (by!=='conv'||a.visitas_perfil>50) && (by!=='cpm'||a.impresiones>0))
    .sort((a,b)=>asc?a[by]-b[by]:b[by]-a[by]).slice(0,4);
  const fmtBy = {visitas_perfil:fInt,seguidores:fInt,alcance:fInt,impresiones:fInt,ctr_unico:fPct,cpm:fMXN2,conv:fPct}[by];
  const byLabel = topOpts.find(o=>o[0]===by)[1].replace(' más bajo','').toLowerCase();
  h += `<div class="section"><div class="top-head"><div><h2 class="section-title">Top anuncios</h2><p class="section-desc" style="margin:0">Los cuatro anuncios con mejor resultado en el periodo y objetivo elegidos.</p></div>
    <label><span style="font-size:.85rem;color:var(--muted);margin-right:.5rem">Ordenar por</span><select id="topBy">${topOpts.map(([k,l])=>`<option value="${k}" ${k===by?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${top.length ? `<div class="ad-grid">${top.map((a,i)=>adCard(a,{ rank:i+1, highlight:`<strong>${fmtBy(a[by])}</strong> ${byLabel}` })).join('')}</div>` : '<div class="table-wrap"><div class="empty">Sin anuncios con dato para esta métrica en el periodo.</div></div>'}</div>`;

  const cols = showWeb ? [...META_COLS, {k:'clics_enlace',l:'Clics al sitio',f:fInt}] : META_COLS;
  const sets = [...groupBy(rows, r=>r.campana+'||'+r.conjunto)].map(([k,rs])=>({ name:rs[0].conjunto, sub:rs[0].campana, ...metaDerive(sum(rs,META_SUM)) }));
  h += `<div class="section"><h2 class="section-title">Por conjunto de anuncios</h2><p class="section-desc">Solo lo que cada conjunto gastó dentro del periodo elegido. Toca una columna para ordenar.</p>${tableHTML('meta-sets','Conjunto de anuncios', sets, cols, t)}</div>`;
  h += libraryHTML('meta-lib', 'Biblioteca de anuncios', 'Métricas de cada anuncio en el periodo elegido.', adList,
    list => tableHTML('meta-ads','Anuncio', list.map(a=>({ ...a, sub:a.conjunto, thumb:a.imagen||null })), cols));
  h += `<p class="note" style="margin-top:-2rem">Alcance y frecuencia en totales y conjuntos se suman entre anuncios, así que pueden quedar algo arriba del alcance único que muestra Ads Manager. «—» indica dato no disponible.</p>`;

  view.innerHTML = h;
  view.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>{ state.objetivo=b.dataset.obj; render(); });
  document.getElementById('topBy').onchange = e => { state.topBy=e.target.value; render(); };
  bindSort(); bindLibraries(); chartDefaults();
  const byMonth = spendChart('c1', dailyFor('meta', d => state.objetivo==='all' || d.objetivo===state.objetivo));
  if(byMonth) document.getElementById('c1t').textContent = 'Gasto e impresiones por mes';
  const byObj = OBJETIVOS_META.filter(o=>presentes.has(o)).map(o=>({ o, ...metaDerive(sum(base.filter(r=>r.objetivo===o),META_SUM)) }));
  charts.push(new Chart(document.getElementById('c2'), { type:'bar', data:{ labels:byObj.map(x=>x.o), datasets:[{ label:'CPM', data:byObj.map(x=>x.cpm),
      backgroundColor:byObj.map(x=> state.objetivo==='all'||state.objetivo===x.o ? css('--c1') : css('--c3')), borderRadius:2 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>'CPM '+fMXN2(c.raw)}}},
      scales:{ x:{ beginAtZero:true, ticks:{callback:v=>'$'+v} }, y:{grid:{display:false}} } } }));
}

/* ----- TIKTOK ----- */
function renderTikTok(){
  const rows = rowsFor('tiktok');
  const t = ttDerive(sum(rows, TT_SUM));
  let h = kpiStrip([
    {l:'Gasto', v:fMXN(t.gasto)},{l:'Alcance', v:fCompact(t.alcance)},{l:'Impresiones', v:fCompact(t.impresiones)},{l:'Clics', v:fCompact(t.clics)},
    {l:'Visualizaciones', v:fCompact(t.vv)},{l:'Visualiz. al 50\u00a0%', v:fCompact(t.vv50), n:fPct(div(t.vv50,t.vv))+' de las vistas'},
    {l:'Visualiz. al 100\u00a0%', v:fCompact(t.vv100), n:fPct(div(t.vv100,t.vv))+' de las vistas'},{l:'CPM', v:fMXN2(t.cpm)}
  ]);
  h += `<div class="section grid-2">
    <div><h2 class="section-title">Retención de video por anuncio</h2><p class="section-desc">Cuántas visualizaciones llegan a la mitad y al final.</p><div class="panel"><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div><h2 class="section-title" id="c2t">Gasto e impresiones por día</h2><p class="section-desc">Cuenta de TikTok de ${CENTROS[state.centro].nombre}.</p><div class="panel"><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>`;
  const grupos = [...groupBy(rows, r=>r.campana+'||'+r.grupo)].map(([k,rs])=>({ name:rs[0].grupo, sub:rs[0].campana, ...ttDerive(sum(rs,TT_SUM)) }));
  h += `<div class="section"><h2 class="section-title">Por grupo de anuncios</h2><p class="section-desc">Toca una columna para ordenar.</p>${tableHTML('tt-sets','Grupo de anuncios',grupos,TT_COLS,t)}</div>`;
  const ads = rows.map(r=>({ name:r.anuncio, sub:r.grupo, ...ttDerive(r) }));
  h += `<div class="section"><h2 class="section-title">Por anuncio</h2><p class="section-desc">Cada fila es un video dentro de su grupo.</p>${tableHTML('tt-ads','Anuncio',ads,TT_COLS)}</div>`;
  view.innerHTML = h; bindSort(); chartDefaults();
  const adAgg = [...groupBy(rows,r=>r.anuncio)].map(([k,rs])=>({k, ...sum(rs,TT_SUM)}));
  charts.push(new Chart(document.getElementById('c1'), { type:'bar', data:{ labels:adAgg.map(a=>a.k), datasets:[
      {label:'Visualizaciones', data:adAgg.map(a=>a.vv), backgroundColor:css('--c3'), borderRadius:2},
      {label:'Al 50\u00a0%', data:adAgg.map(a=>a.vv50), backgroundColor:css('--c2'), borderRadius:2},
      {label:'Al 100\u00a0%', data:adAgg.map(a=>a.vv100), backgroundColor:css('--c1'), borderRadius:2} ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+fInt(c.raw)}}},
      scales:{ x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:false, callback:function(v){ const l=String(this.getLabelForValue(v)); return l.length>14? l.slice(0,13)+'…':l; }}}, y:{beginAtZero:true, ticks:{callback:v=>fCompact(v)}} } } }));
  if(spendChart('c2', dailyFor('tiktok'))) document.getElementById('c2t').textContent = 'Gasto e impresiones por mes';
}

/* ----- GOOGLE ----- */
function renderGoogle(){
  const rows = rowsFor('google');
  const t = gDerive(sum(rows, G_SUM));
  let h = kpiStrip([
    {l:'Gasto', v:fMXN(t.gasto)},{l:'Impresiones', v:fCompact(t.impresiones)},{l:'Clics', v:fCompact(t.clics)},{l:'CTR', v:fPct(t.ctr)},
    {l:'Interacciones', v:fCompact(t.interacciones)},{l:'Visualiz. al 25\u00a0%', v:fCompact(t.vv25)},
    {l:'Visualiz. al 100\u00a0%', v:fCompact(t.vv100), n:fPct(div(t.vv100,t.vv25))+' de las que llegan al 25\u00a0%'}
  ]);
  h += `<div class="section grid-2">
    <div><h2 class="section-title">Clics y CTR por grupo</h2><p class="section-desc">Campaña ${CENTROS[state.centro].nombre}.</p><div class="panel"><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div><h2 class="section-title">Video: del 25\u00a0% al 100\u00a0%</h2><p class="section-desc">Solo grupos de video (YouTube y Demand Gen).</p><div class="panel"><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>`;
  const grupos = [...groupBy(rows,r=>r.grupo)].map(([k,rs])=>({ name:k, sub:rs[0].campana, ...gDerive(sum(rs,G_SUM)) }));
  h += `<div class="section"><h2 class="section-title">Por grupo de anuncios</h2><p class="section-desc">Toca una columna para ordenar.</p>${tableHTML('g-sets','Grupo de anuncios',grupos,G_COLS,t)}</div>`;
  // Google Ads no reporta alcance, CTR único ni frecuencia por anuncio: se muestran como «—».
  // La fila "Sin desglose por anuncio" solo cuadra totales (no es un anuncio): cuenta en KPIs y grupos, no en la biblioteca.
  const ads = rows.filter(r=>r.ad_id).map(r=>({ ...gDerive(r), name:r.anuncio, campana:r.campana, grupo:r.grupo, imagen:r.imagen||null, imagen_alt:r.imagen_alt||null,
    alcance:null, ctr_unico:null, frecuencia:null }));
  h += libraryHTML('g-lib', 'Biblioteca de anuncios', 'Google Ads no reporta alcance, CTR único ni frecuencia por anuncio («—»).', ads,
    list => tableHTML('g-ads','Anuncio', list.map(a=>({ ...a, sub:a.grupo, thumb:a.imagen||null })), G_COLS));
  view.innerHTML = h; bindSort(); bindLibraries(); chartDefaults();
  charts.push(new Chart(document.getElementById('c1'), { data:{ labels:grupos.map(g=>g.name), datasets:[
      {type:'bar',order:1,label:'Clics',data:grupos.map(g=>g.clics),backgroundColor:css('--c3'),yAxisID:'y',borderRadius:2},
      {type:'line',order:0,label:'CTR',data:grupos.map(g=>g.ctr*100),borderColor:css('--c1'),backgroundColor:css('--c1'),yAxisID:'y1',pointRadius:4,tension:.3} ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'bottom',labels:{boxWidth:10}}, tooltip:{callbacks:{label:c=>c.dataset.label==='CTR'?'CTR '+c.raw.toFixed(2)+'\u00a0%':'Clics '+fInt(c.raw)}}},
      scales:{ x:{grid:{display:false}}, y:{beginAtZero:true, ticks:{callback:v=>fCompact(v)}}, y1:{position:'right',beginAtZero:true,grid:{display:false},ticks:{callback:v=>v+'\u00a0%'}} } } }));
  const vid = grupos.filter(g=>g.vv25>0);
  charts.push(new Chart(document.getElementById('c2'), { type:'bar', data:{ labels:vid.map(g=>g.name), datasets:[
      {label:'Al 25\u00a0%',data:vid.map(g=>g.vv25),backgroundColor:css('--c3'),borderRadius:2},
      {label:'Al 100\u00a0%',data:vid.map(g=>g.vv100),backgroundColor:css('--c1'),borderRadius:2} ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+fInt(c.raw)}}},
      scales:{ x:{grid:{display:false}}, y:{beginAtZero:true, ticks:{callback:v=>fCompact(v)}} } } }));
}

// Achica el número de un KPI hasta que quepa en su celda (nunca se encima con el de al lado).
function fitKpis(){
  view.querySelectorAll('.kpi-value').forEach(el=>{
    el.style.fontSize='';
    let size = parseFloat(getComputedStyle(el).fontSize), guard=0;
    while(el.scrollWidth > el.clientWidth && size > 14 && guard++ < 40){ size -= 1; el.style.fontSize = size+'px'; }
  });
}
function render(){
  killCharts(); renderShell();
  if(state.plat==='general') renderGeneral(); else if(state.plat==='meta') renderMeta(); else if(state.plat==='tiktok') renderTikTok(); else renderGoogle();
  requestAnimationFrame(fitKpis);
}
window.addEventListener('resize', ()=>fitKpis());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitKpis());

/* ----- GENERAL (Meta + TikTok + Google Ads) ----- */
function renderGeneral(){
  const plats = ['meta','tiktok','google'];
  const per = plats.map(p=>{
    const rows = rowsFor(p);
    const o = sum(rows, ['gasto','impresiones','alcance','clics','clics_enlace']);
    const clics = p==='meta' ? o.clics_enlace : o.clics;
    const st = SOURCE_STATUS[p]; const ok = st==='live' || st==='sheet';
    return { p, ok, st, gasto:o.gasto, impresiones:o.impresiones, alcance: p==='google' ? null : o.alcance, clics,
             cpm:div(o.gasto,o.impresiones)*1000, ctr:div(clics,o.impresiones) };
  });
  const inc = per.filter(x=>x.ok);
  const T = { gasto:0, impresiones:0, alcance:0, clics:0 };
  inc.forEach(x=>{ T.gasto+=x.gasto; T.impresiones+=x.impresiones; T.alcance+=x.alcance||0; T.clics+=x.clics; });
  T.cpm = div(T.gasto,T.impresiones)*1000; T.ctr = div(T.clics,T.impresiones);
  const fuera = per.filter(x=>!x.ok).map(x=>PLAT_NOMBRE[x.p]);

  let h = kpiStrip([
    {l:'Gasto total', v:fMXN(T.gasto), n: inc.map(x=>PLAT_NOMBRE[x.p].replace(' Ads','')).join(' + ') || 'Sin plataformas conectadas'},
    {l:'Impresiones', v:fCompact(T.impresiones)},
    {l:'Alcance', v:fCompact(T.alcance), n:'Meta + TikTok'},
    {l:'Clics', v:fCompact(T.clics)},
    {l:'CPM', v:fMXN2(T.cpm)},
    {l:'CTR', v:fPct(T.ctr)},
  ]);
  if(fuera.length) h += `<p class="note" style="margin:-1.5rem 0 2rem">${fuera.join(' y ')} todavía no ${fuera.length>1?'están conectados':'está conectado'}: no ${fuera.length>1?'se suman':'se suma'} al total general.</p>`;
  h += `<div class="section grid-2">
    <div><h2 class="section-title" id="g1t">Gasto por día y plataforma</h2><p class="section-desc">Suma de las plataformas conectadas.</p><div class="panel"><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div><h2 class="section-title">Reparto del gasto</h2><p class="section-desc">Cuánto de la inversión va a cada plataforma.</p><div class="panel"><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>`;
  const GEN_COLS = [
    {k:'gasto',l:'Gasto',f:fMXN2},{k:'share',l:'% del gasto',f:fPct},{k:'impresiones',l:'Impresiones',f:fInt},
    {k:'alcance',l:'Alcance',f:fIntDash},{k:'clics',l:'Clics',f:fInt},{k:'cpm',l:'CPM',f:fMXN2},{k:'ctr',l:'CTR',f:fPct},
  ];
  const tRows = per.map(x=> x.ok
    ? { ...x, name:PLAT_NOMBRE[x.p], sub: x.st==='sheet'?'Google Sheets':'En vivo', share: div(x.gasto,T.gasto) }
    : { p:x.p, name:PLAT_NOMBRE[x.p], sub:'Sin conectar · no suma al total', gasto:null, share:null, impresiones:null, alcance:null, clics:null, cpm:null, ctr:null });
  const tot = { ...T, share: inc.length?1:0 };
  h += `<div class="section"><h2 class="section-title">Resultados por plataforma</h2><p class="section-desc">${CENTROS[state.centro].nombre}, en el periodo elegido.</p>
    ${tableHTML('gen', 'Plataforma', tRows, GEN_COLS.map(c=>({ ...c, f: v => v==null ? '—' : c.f(v) })), tot)}
    <p class="note">Meta cuenta como clics los clics en enlaces. Google Ads no reporta alcance, por eso el alcance general es Meta + TikTok, y se suma entre plataformas y anuncios (puede repetir personas).</p></div>`;
  view.innerHTML = h; bindSort(); chartDefaults();

  // Gasto diario apilado por plataforma
  const r = resolveRange(); const days = eachDay(r.since, r.until); const byMonth = days.length > 62;
  const keyOf = f => byMonth ? f.slice(0,7) : f; const keys = [...new Set(days.map(keyOf))];
  const colors = { meta:css('--c1'), tiktok:css('--c2'), google:css('--c4') };
  const datasets = inc.map(x=>{
    const acc = new Map(keys.map(k=>[k,0]));
    dailyFor(x.p).forEach(d=>{ const k=keyOf(d.fecha); if(acc.has(k)) acc.set(k, acc.get(k)+(d.gasto||0)); });
    return { label:PLAT_NOMBRE[x.p], data:keys.map(k=>acc.get(k)), backgroundColor:colors[x.p], borderRadius:2, stack:'g' };
  });
  if(byMonth) document.getElementById('g1t').textContent = 'Gasto por mes y plataforma';
  charts.push(new Chart(document.getElementById('c1'), { type:'bar', data:{ labels: keys.map(k=> byMonth ? MES_NOMBRES[+k.slice(5,7)-1].slice(0,3)+' '+k.slice(0,4) : fmtFechaCorta(k)), datasets },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom',labels:{boxWidth:10}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+fMXN(c.raw)}} },
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}, y:{stacked:true, beginAtZero:true, ticks:{callback:v=>fCompactMXN(v)}} } } }));
  charts.push(new Chart(document.getElementById('c2'), { type:'bar', data:{ labels: inc.map(x=>PLAT_NOMBRE[x.p]), datasets:[{ label:'Gasto', data: inc.map(x=>x.gasto), backgroundColor: inc.map(x=>colors[x.p]), borderRadius:2 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>fMXN(c.raw)+' · '+fPct(div(c.raw,T.gasto))}} },
      scales:{ x:{beginAtZero:true, ticks:{maxRotation:0, maxTicksLimit:6, callback:v=>fCompactMXN(v)}}, y:{grid:{display:false}} } } }));
}
let loadSeq = 0;
let sheetLoaded = null;
async function refresh(){
  const seq = ++loadSeq;
  view.classList.add('loading'); renderPeriodo();
  if(!sheetLoaded){ sheetLoaded = loadSheet(); }
  await sheetLoaded;
  await loadRange(resolveRange());
  if(seq !== loadSeq) return;           // llegó otra selección mientras cargaba
  view.classList.remove('loading');
  state.showAll = {};
  render();
}

/* ===== Eventos ===== */
document.querySelectorAll('.centro-btn').forEach(b=>b.onclick=()=>{ state.centro=b.dataset.centro; state.objetivo='all'; state.search=''; render(); window.scrollTo({top:0}); });
document.querySelectorAll('.plat-btn').forEach(b=>b.onclick=()=>{ state.plat=b.dataset.plat; render(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>render());

refresh();
</script>
